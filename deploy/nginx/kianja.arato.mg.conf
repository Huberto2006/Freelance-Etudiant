# A installer dans /etc/nginx/sites-available/kianja.arato.mg.conf,
# puis a activer dans sites-enabled sur le serveur.
# Utilise le Nginx EXISTANT : aucun nouveau port 80/443 n'est publie par Docker.
map $http_upgrade $kianja_host_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name kianja.arato.mg;

    client_max_body_size 20m;

    access_log /var/log/nginx/kianja.arato.mg.access.log;
    error_log /var/log/nginx/kianja.arato.mg.error.log;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ecrase tout X-Forwarded-For fourni par le navigateur.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kianja_host_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

