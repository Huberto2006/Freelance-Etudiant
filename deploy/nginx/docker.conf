map $http_upgrade $kianja_connection_upgrade {
    default upgrade;
    '' close;
}

# Le Nginx hote transmet le protocole public apres certification Certbot.
map $http_x_forwarded_proto $kianja_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

# Suit les changements d'IP quand Compose recree les conteneurs.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream kianja_backend {
    zone kianja_backend 64k;
    server backend:3000 resolve;
}
upstream kianja_frontend {
    zone kianja_frontend 64k;
    server frontend:3000 resolve;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kianja_forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /healthz {
        proxy_pass http://kianja_backend/api/v1/health;
        access_log off;
    }

    location /api/ {
        proxy_pass http://kianja_backend;
    }

    location /uploads/ {
        proxy_pass http://kianja_backend;
    }

    location /socket.io/ {
        proxy_pass http://kianja_backend;
        # Nginx ne herite pas des proxy_set_header si ce bloc en declare.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $kianja_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kianja_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://kianja_frontend;
        # Les reponses Next.js peuvent etre diffusees progressivement.
        proxy_buffering off;
    }
}
